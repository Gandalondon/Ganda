name: Update Lionel prototype

on:
  push:
    branches: [main]
    paths:
      - ".github/lionel-update.bsdiff"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install bsdiff4
      - name: Apply verified prototype update
        run: |
          bspatch4 public/lionel/index.html public/lionel/index.html.new .github/lionel-update.bsdiff
          mv public/lionel/index.html.new public/lionel/index.html
          rm .github/lionel-update.bsdiff .github/workflows/update-lionel.yml
      - name: Commit updated prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Lionel prototype export"
          git push
