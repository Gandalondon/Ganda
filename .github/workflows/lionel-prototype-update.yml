name: Update Lionel prototype

on:
  push:
    paths:
      - .github/lionel-update.part00

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply prototype update
        run: |
          python -m pip install bsdiff4
          cat .github/lionel-update.part* > /tmp/lionel-update.bsdiff
          bspatch4 public/lionel/index.html public/lionel/index.new.html /tmp/lionel-update.bsdiff
          mv public/lionel/index.new.html public/lionel/index.html
          rm .github/lionel-update.part*
          rm .github/workflows/lionel-prototype-update.yml
      - name: Commit updated prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lionel/index.html .github
          git commit -m "Update Lionel prototype"
          git push
